[package]
name = "sandbox-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "SPIKE (D-11): run user JS decide(ctx) in a Javy/QuickJS guest inside Wasmtime"

# Standalone: not a member of backend/.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation", "wat"] }

# Cranelift is very slow unoptimised; optimise dependencies even in `cargo test`.
[profile.dev.package."*"]
opt-level = 3
