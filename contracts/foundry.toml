[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
# Arc's baseline is Osaka; its docs do not state a required evm_version (unverified).
# Prague is the conservative choice. Use the same settings for deploy and verify.
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 128
fail_on_revert = false
